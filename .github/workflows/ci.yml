# CI runs the same checks as `make check`, in containers, with no cloud
# credentials present.
#
# That last part is not incidental: it is how the vendor-neutrality claim is
# tested rather than asserted. A dependency that cannot run here cannot merge.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel superseded runs on the same branch. A PR pushed three times should
  # not occupy three runners proving the first two commits still compile.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # Fast feedback first. If the code is not formatted there is no point
  # spending four minutes discovering the tests also pass.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build every binary
        run: go build ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::run 'go mod tidy' and commit the result"; exit 1; }

      - name: Documentation links resolve
        run: python3 scripts/check-links.py

      - name: Documented make targets exist
        run: python3 scripts/check-make-targets.py

      # Runs before the compile-and-test jobs on purpose: it needs no toolchain
      # and finishes in under a second, so a layering regression is reported in
      # the first few seconds of CI rather than after the Playwright suite.
      - name: Architecture invariants
        run: python3 scripts/arch/check.py

      - name: Destructive-command guard still blocks what it claims to
        run: python3 .claude/hooks/guard-destructive.py --self-test

      - name: Kubernetes manifests render and validate
        run: scripts/check-manifests.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -race is non-negotiable. Concurrency bugs that only appear under
      # production load are the most expensive class of defect we can ship.
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -25

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: the extension must exist or every
        # migration fails on the first statement.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Integration tests
        env:
          DATABASE_URL: postgres://jobtrack:test@localhost:5432/jobtrack?sslmode=disable
        run: go test -tags=integration -count=1 ./...

      # Migrations must apply cleanly from empty AND be idempotent on a second
      # run. The second run is the one that catches a migration that only works
      # against a fresh database.
      - name: Migrations apply from empty and are idempotent
        env:
          DATABASE_URL: postgres://jobtrack:test@localhost:5432/jobtrack?sslmode=disable
          SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
          go run ./cmd/migrate status

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestor, scheduler, resume-parser, migrate, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.service }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          push: false
          load: true
          tags: jobtrack/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Distroless images must stay small and shell-free. A regression here
      # usually means someone switched the base to debug something and forgot.
      #
      # web gets its own budget: the Node runtime alone is ~120MB unpacked, so
      # 60MB could only be met by not shipping it. Sizes here are UNPACKED; a
      # Docker Desktop with the containerd store reports the compressed size
      # (web: 51MB), which is how 142MB passed a local check.
      - name: Image is minimal and has no shell
        env:
          BUDGET_MB: ${{ matrix.service == 'web' && 150 || 60 }}
        run: |
          size=$(docker image inspect jobtrack/${{ matrix.service }}:ci \
                   --format '{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "image size: ${mb}MB"
          if [ "$mb" -gt "$BUDGET_MB" ]; then
            echo "::error::image is ${mb}MB, budget is ${BUDGET_MB}MB"; exit 1
          fi
          if docker run --rm --entrypoint /bin/sh \
               jobtrack/${{ matrix.service }}:ci -c 'echo shell present' 2>/dev/null; then
            echo "::error::image contains a shell"; exit 1
          fi

  # The production path, booted and used. Every other job here passed while it
  # could not have run at all: a Postgres digest that did not exist, APP_ENV
  # spelled ENV, no web image, and a proxy with no route to the api.
  prod-smoke:
    name: Production stack boots and serves
    runs-on: ubuntu-latest
    needs: [static]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Boot docker-compose.prod.yml and use it over HTTPS
        run: scripts/prod-smoke.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check
        run: npx svelte-kit sync && npx svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # A budget that only warns is a budget that gets exceeded. This fails the
      # build, so a regression is caught by the PR that caused it rather than
      # six releases later.
      - name: Performance budget
        run: node scripts/check-budget.js

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [static, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jobtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://jobtrack:test@localhost:5432/jobtrack?sslmode=disable
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-chars
      RESUME_ENCRYPTION_KEY: ci-only-resume-key-at-least-32-chars
      RESUME_PARSER_URL: http://localhost:9090
      COOKIE_SECURE: "false"
      # Far above production, for the same reason docker-compose.yml sets it:
      # every browser in the suite shares one address, so a limit tuned for one
      # person throttles the whole run. It surfaces as a signup that silently
      # stays on /signup and a feed that is "unavailable" — a working limiter
      # wearing the costume of a broken app. Nine 429s before this was set.
      RATE_LIMIT_PER_MINUTE: "60000"
      RATE_LIMIT_BURST: "2000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Migrate and seed
        run: |
          go run ./cmd/migrate up
          # -ingest replays the golden fixtures; INGEST_MODE defaults to fixture,
          # so this reaches no network and cannot touch a live ATS (ADR-0004,
          # ADR-0021). Without it the corpus is empty and every feed assertion
          # fails on an empty state.
          go run ./cmd/seed -ingest

      - name: Start resume-parser
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          DATABASE_URL= HTTP_ADDR=:9090 go run ./cmd/resume-parser &
          for i in $(seq 1 30); do
            curl -sf localhost:9090/readyz >/dev/null && break
            sleep 1
          done
          curl -sf localhost:9090/readyz

      - name: Start API
        run: |
          go run ./cmd/api &
          for i in $(seq 1 30); do
            curl -sf localhost:8080/readyz >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8080/readyz

      - name: Start web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          API_URL=http://localhost:8080 npm run dev &
          for i in $(seq 1 40); do
            curl -sf localhost:5173 >/dev/null && break
            sleep 2
          done

      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium

      # The INP budget, gated. It was measured by hand (A-32) and a regression
      # failed nothing. Its own step, one worker: four parallel browsers under
      # 4x throttling would measure the runner's contention, not the page.
      - name: INP p75 within 200 ms at 4x CPU throttle
        working-directory: web
        env:
          E2E_INP: "1"
          E2E_WORKERS: "1"
        run: npx playwright test inp.spec.ts --project=chromium --reporter=list

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      # Full history, as gitleaks-action requires. It scans the pushed range
      # first^..last, and a depth-1 clone does not contain first^ — so every
      # push of MORE than one commit failed with "unknown revision" while
      # single-commit pushes, scanned without a parent, passed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The dependency budget from docs/product/principles.md P6, made
      # mechanical. Adding a 13th direct dependency should force a conversation,
      # not slip through review.
      - name: Dependency budget
        run: |
          count=$(go list -m -f '{{if not .Indirect}}{{.Path}}{{end}}' all \
                    | grep -v '^github.com/ergodicregulus/jobtrack$' \
                    | grep -v '^golang.org/x/' \
                    | grep -v '^go.opentelemetry.io/' \
                    | grep -c . || true)
          echo "direct dependencies (excluding x/ and otel): $count"
          if [ "$count" -gt 12 ]; then
            echo "::error::dependency budget is 12, found $count"; exit 1
          fi

      # A secret in git history is compromised the moment it is pushed, so the
      # useful check is the one that runs before merge rather than the audit
      # that runs after. Full history on PRs: a secret added and then "removed"
      # in a later commit is still in the pack.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CodeQL finds classes `go vet` does not — taint flow into SQL, path handling,
  # and the injection shapes that only show up across function boundaries.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          category: /language:${{ matrix.language }}

  # Every migration must apply forward against the PREVIOUS release's schema.
  # This is the expand/contract rule, which until now was enforced by review —
  # and review is not a mechanism, it is a hope.
  migration-compat:
    name: Migrations are backward compatible
    runs-on: ubuntu-latest
    needs: [static]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: jobtrack
        options: >-
          --health-cmd "pg_isready -U jobtrack -d jobtrack"
          --health-interval 2s --health-timeout 3s --health-retries 15
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build the previous release's schema, then migrate onto it
        env:
          DATABASE_URL: postgres://jobtrack:dev@localhost:5432/jobtrack?sslmode=disable
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-v:refname | head -1)
          if [ -z "$prev" ]; then
            echo "no previous tag; nothing to compare against"; exit 0
          fi
          echo "previous release: $prev"

          # Apply the previous release's migrations...
          git checkout "$prev" -- migrations/
          go run ./cmd/migrate up

          # ...then this branch's, forward, onto that schema.
          git checkout HEAD -- migrations/
          go run ./cmd/migrate up
          go run ./cmd/migrate verify

  # The server-side latency budgets, measured rather than asserted by hand.
  # Smoke profile only on PR: enough to catch a plan regression, short enough
  # not to dominate the run.
  load:
    name: Load test
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bring the stack up
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres
          docker compose run --rm migrate
          docker compose run --rm tools "go run ./cmd/seed -ingest"
          # Warm the build cache for THIS binary before air has to compile it
          # inside the api container, where the only signal is a healthcheck
          # timing out. -buildvcs=false because git inside the container refuses
          # the bind-mounted repo as dubiously owned, and `go build` turns that
          # into "error obtaining VCS status: exit status 128" and fails.
          docker compose run --rm --no-deps tools "go build -buildvcs=false -o /dev/null ./cmd/api"
          docker compose up -d --wait api

      # Without this, a container that crashed and a container that was merely
      # slow produce the same message: "is unhealthy".
      - name: Container logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 api || true

      # k6 fails the step itself: the pass criteria are thresholds inside the
      # script, so this cannot pass by the output format changing.
      - name: k6
        run: make load-test

  # The rendering invariants, mechanically. This suite is already written and
  # already green; leaving it out of CI was the only way it could regress.
  accessibility:
    name: Rendering and accessibility audit
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bring the stack up
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres
          docker compose run --rm migrate
          docker compose run --rm tools "go run ./cmd/seed -ingest"
          docker compose run --rm --no-deps tools "go build -buildvcs=false -o /dev/null ./cmd/api"
          docker compose up -d --wait api web

      - name: ui-audit
        run: make ui-audit

      # After the audit, not before: a failure() step only sees the steps that
      # ran ahead of it, so above it this never fired for an audit failure.
      - name: Container logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 api web || true

      # Screenshots on failure, because every layout bug in this project so far
      # was found by looking rather than by testing.
      - name: Screenshots
        if: failure()
        run: make screenshots || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: screenshots
          path: web/.screenshots/
          retention-days: 7

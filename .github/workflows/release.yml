# Release: build once, prove where it came from, publish by digest.
#
# The property this workflow exists to create is that a deployed image can be
# traced back to a commit and a workflow run WITHOUT trusting the registry, the
# person who pushed, or a mutable tag. Three things together do that:
#
#   SBOM        — what is inside, so a CVE question is answerable
#   signature   — who built it, keyless via OIDC so there is no key to leak
#   provenance  — how it was built, generated by the builder rather than by us
#
# Tags are mutable and therefore not identity. Everything downstream — the
# deploy workflow included — refers to images by DIGEST.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the current ref)"
        required: false

concurrency:
  # Never cancel a release mid-publish: a half-pushed manifest is worse than a
  # queued run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  # A release is only worth building from a commit that already passed CI.
  # Re-running the gate here rather than trusting that someone looked.
  verify:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Formatting, vet, build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::unformatted"; exit 1; }
          go vet ./...
          go build ./...

      - name: Unit tests with the race detector
        run: go test -race -count=1 ./...

      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  images:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # OIDC, for keyless signing
      attestations: write    # build provenance
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingestor, scheduler, resume-parser, migrate, web]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # linux/arm64 is not decoration: it is the cheapest instance class on most
      # clouds and it is what an Apple-silicon workstation runs natively.
      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      # The same two assertions CI makes. A release must not be the first place
      # a 200MB image with a shell in it gets noticed.
      - name: Image is minimal and has no shell
        run: |
          ref="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          docker pull -q "$ref"
          mb=$(( $(docker image inspect "$ref" --format '{{.Size}}') / 1024 / 1024 ))
          echo "image size: ${mb}MB"
          [ "$mb" -le 60 ] || { echo "::error::image is ${mb}MB, budget is 60MB"; exit 1; }
          if docker run --rm --entrypoint /bin/sh "$ref" -c 'echo shell' 2>/dev/null; then
            echo "::error::image contains a shell"; exit 1
          fi

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          output-file: sbom-${{ matrix.service }}.spdx.json

      # Scan the SBOM, not the image: it is faster and it is the same inventory
      # we publish, so the scan and the document cannot disagree.
      #
      # There is deliberately no allowlist file here. If one becomes necessary,
      # every entry needs an expiry date — a permanent exception is not an
      # exception, it is a decision to ship the vulnerability.
      - name: Vulnerability scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          severity-cutoff: high
          fail-build: true

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      # Keyless. The signing identity is this repository and this workflow,
      # asserted by GitHub's OIDC provider — there is no private key to store,
      # rotate, or leak, and a signature cannot be produced from anywhere else.
      - name: Sign the image
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: Attach the SBOM as an attestation
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.service }}.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      # Provenance generated by the build service rather than by a step we
      # control. That is the distinction that makes SLSA build level 3
      # non-falsifiable — a compromised build step cannot forge it.
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the SBOM with the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

# The shape of jobtrack-secrets. A TEMPLATE: deploy.sh never applies this file,
# because applying it would overwrite real values with these empty ones. Create
# the Secret with external-secrets, SOPS, or `kubectl create secret generic`.
#
# It used to live inside config.yaml beside the ConfigMap, which is why deploy.sh
# applied neither — and so the ConfigMap never reached a cluster either.
# S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY are gone with the object store
# (ADR-0020).

# NOT a source of secrets. This declares the keys the services require so that a
# missing one fails at rollout rather than at the first request that needs it.
# Populate with external-secrets, SOPS, or `kubectl create secret` — never by
# committing values.
apiVersion: v1
kind: Secret
metadata:
  name: jobtrack-secrets
  annotations:
    jobtrack.dev/managed-by: >-
      external-secrets or SOPS. If you are reading a real value here, it has
      leaked and needs rotating, not editing.
type: Opaque
stringData:
  DATABASE_URL: ""
  SESSION_SECRET: ""
  # AES-256-GCM key for resume text at rest. Separate from SESSION_SECRET on
  # purpose: a leaked session secret must not also decrypt CVs.
  RESUME_ENCRYPTION_KEY: ""

# The two background services: ingestor and scheduler.
#
# Neither has an HTTP surface of its own, so app.RunWorker serves one for probes:
# /livez (the process is scheduling goroutines) and /readyz (it can reach the
# database River keeps its queue in). The image is distroless, so an `exec` probe
# has no shell to run; httpGet is the only probe available, and until the workers
# served something it had nothing to call. A wedged worker was never restarted.
#
# The namespace is default-deny, which does not block these: "traffic to and
# from the node where a Pod is running is always allowed" (Kubernetes
# NetworkPolicy docs), and kubelet probes originate on the node. Liveness uses
# /livez, not /readyz, because restarting a worker does not fix a database
# outage — it only multiplies the reconnects.
#
# What does bound the damage today: River leases jobs, so a worker that dies
# mid-job has its work re-run by another after the lease expires, and the
# scheduler's periodic jobs are leader-elected in Postgres rather than pinned to
# a process.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtrack-ingestor
  labels:
    app.kubernetes.io/name: jobtrack
    app.kubernetes.io/component: ingestor
    app.kubernetes.io/version: "{{VERSION}}"
spec:
  # Horizontally scalable: River hands each job to exactly one worker, and the
  # per-host politeness limiter is in-process per pod. More pods therefore means
  # more concurrent HOSTS, not more requests to one host.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: ingestor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtrack
        app.kubernetes.io/component: ingestor
        app.kubernetes.io/version: "{{VERSION}}"
    spec:
      # Longer than the api's 45s: an in-flight fetch of a large board plus its
      # detail sweep can legitimately take longer than a request does.
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestor
          image: "{{REGISTRY}}/ingestor:{{VERSION}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Gates a rollout: a new version that cannot reach the database is
          # never marked available, so it cannot replace a working one.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: jobtrack-config
            - secretRef:
                name: jobtrack-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Network-bound work; a CPU limit here buys throttling and
              # nothing else.
              memory: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtrack-scheduler
  labels:
    app.kubernetes.io/name: jobtrack
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/version: "{{VERSION}}"
spec:
  # Two replicas, and only one does the enqueuing.
  #
  # Leadership is decided by a Postgres advisory lock, not by replica count, so
  # a second pod is a warm standby rather than a duplicate. Running one replica
  # instead would mean every node drain stops all scheduling until the pod is
  # rescheduled.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtrack
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/version: "{{VERSION}}"
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: "{{REGISTRY}}/scheduler:{{VERSION}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Gates a rollout: a new version that cannot reach the database is
          # never marked available, so it cannot replace a working one.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: jobtrack-config
            - secretRef:
                name: jobtrack-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

---
# Both workers get a PDB for the same reason the api does: without one, a node
# drain can evict every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobtrack-ingestor
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: ingestor

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobtrack-scheduler
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: scheduler

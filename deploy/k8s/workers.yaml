# The two background services: ingestor and scheduler.
#
# Neither serves HTTP, which is why neither has a probe. That is a deliberate
# omission rather than an oversight, and it is a real gap worth stating: a
# wedged worker will not be restarted automatically. The image is distroless, so
# an `exec` probe has no shell to run and a `httpGet` probe has no server to
# call. Closing it properly means giving the workers a health endpoint — a code
# change, not a manifest one.
#
# What does bound the damage today: River leases jobs, so a worker that dies
# mid-job has its work re-run by another after the lease expires, and the
# scheduler's periodic jobs are leader-elected in Postgres rather than pinned to
# a process.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtrack-ingestor
  labels:
    app.kubernetes.io/name: jobtrack
    app.kubernetes.io/component: ingestor
    app.kubernetes.io/version: "{{VERSION}}"
spec:
  # Horizontally scalable: River hands each job to exactly one worker, and the
  # per-host politeness limiter is in-process per pod. More pods therefore means
  # more concurrent HOSTS, not more requests to one host.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: ingestor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtrack
        app.kubernetes.io/component: ingestor
        app.kubernetes.io/version: "{{VERSION}}"
    spec:
      # Longer than the api's 45s: an in-flight fetch of a large board plus its
      # detail sweep can legitimately take longer than a request does.
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestor
          image: "{{REGISTRY}}/ingestor:{{VERSION}}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobtrack-config
            - secretRef:
                name: jobtrack-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Network-bound work; a CPU limit here buys throttling and
              # nothing else.
              memory: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobtrack-scheduler
  labels:
    app.kubernetes.io/name: jobtrack
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/version: "{{VERSION}}"
spec:
  # Two replicas, and only one does the enqueuing.
  #
  # Leadership is decided by a Postgres advisory lock, not by replica count, so
  # a second pod is a warm standby rather than a duplicate. Running one replica
  # instead would mean every node drain stops all scheduling until the pod is
  # rescheduled.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobtrack
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/version: "{{VERSION}}"
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: "{{REGISTRY}}/scheduler:{{VERSION}}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobtrack-config
            - secretRef:
                name: jobtrack-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

---
# Both workers get a PDB for the same reason the api does: without one, a node
# drain can evict every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobtrack-ingestor
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: ingestor

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobtrack-scheduler
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobtrack
      app.kubernetes.io/component: scheduler
